<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UIAuto Recorder</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 280px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      padding: 14px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 600;
    }
    .muted { color: #666; font-size: 12px; line-height: 1.5; margin: 0 0 12px; }
    .status {
      padding: 8px 10px;
      border-radius: 8px;
      background: #f4f4f5;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .status--ok { background: #ecfdf5; color: #047857; }
    .status--warn { background: #fff7ed; color: #c2410c; }
    .row { display: flex; gap: 8px; }
    button {
      flex: 1;
      border: 1px solid #d4d4d8;
      background: #fff;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: #fafafa; }
    button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    a { color: #2563eb; font-size: 12px; }
  </style>
</head>
<body>
  <h1>UIAuto Recorder</h1>
  <p class="muted">在平台打开「用例录制」页后，扩展会自动连接会话。</p>
  <div id="status" class="status">检测连接状态…</div>
  <div class="row">
    <button type="button" id="btnReconnect">重新连接</button>
    <button type="button" id="btnDisconnect">断开</button>
  </div>
  <p style="margin-top:12px"><a id="linkDownload" href="#" target="_blank">下载 / 更新扩展</a></p>
  <script src="popup.js"></script>
</body>
</html>
